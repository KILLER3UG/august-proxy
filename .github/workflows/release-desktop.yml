name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 0.12.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Download Node sidecars
        run: npm run download:node-binaries

      - name: Prepare portable Python + backend resources
        # --release: write the real runtime stamp (default is dev-placeholder)
        run: node scripts/prepare-desktop-backend.mjs --release

      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}" -replace '^v', ''
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Releasing version $version"

      - name: Build and publish release assets
        # Tag pushes publish immediately (in-app updater must see them); only
        # workflow_dispatch keeps the draft flow (published by the job below).
        run: node scripts/release-desktop.mjs --version=${{ env.RELEASE_VERSION }} --tauri --publish ${{ github.event_name == 'workflow_dispatch' && '--draft' || '' }}

  publish:
    name: Publish release (flip draft → live)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish draft release
        run: gh release edit v${{ inputs.version }} --draft=false --latest --repo ${{ github.repository }}
