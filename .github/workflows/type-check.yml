name: Type check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-mypy:
    name: Backend — mypy + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-py/pyproject.toml

      - name: Install backend (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run mypy
        run: python -m mypy app/

      - name: Naming guardrail (no new camelCase service params)
        working-directory: ${{ github.workspace }}
        run: node scripts/check-naming.mjs

      # OpenAPI drift gate (audit P1#7): the committed docs/api/openapi.json
      # must match what the app serves — a router change without a schema
      # refresh fails here, and npm run gen:api feeds the same file to the
      # frontend type generator.
      #
      # This lives in the BACKEND job on purpose. The gate imports the app to
      # read its real schema, so it needs a working interpreter with the
      # backend's dependencies — which this job already has from
      # `pip install -e ".[dev]"` — and nothing else. It previously ran in the
      # frontend job, which only does checkout + npm ci, and exited 2 on
      # "backend venv not found" every single run. A gate that cannot pass
      # trains people to click through it.
      - name: OpenAPI drift gate
        working-directory: ${{ github.workspace }}
        run: npm run check:api

      # docs/API_INDEX.md is GENERATED from the committed openapi.json, and the
      # spec is gated immediately above — so this can only fail if someone
      # edited the spec without regenerating the index, or hand-edited a
      # generated file. It is the completeness half of API_REFERENCE.md, which
      # is hand-written and covers ~half the routes by design.
      - name: Generated API index is current
        working-directory: ${{ github.workspace }}
        run: npm run check:api-index

      # The brain-config keys the Settings panel writes must be keys the
      # backend accepts, at values the backend accepts. It lives in the
      # BACKEND job for the same reason as the OpenAPI gate: it imports the
      # app to read the real key set and the real ranges, so it needs the
      # interpreter and the dependencies this job already has.
      #
      # It has already caught two live bugs of the same shape — a key with a
      # fieldTable entry but no writable-set entry, so every PUT naming it
      # was rejected, and a backend range that started at 1 while the panel's
      # own default was 0.
      - name: Brain-config keys and ranges match the backend
        working-directory: ${{ github.workspace }}
        run: npm run check:brain-config

      - name: Version sync (4 manifests + lockfile)
        working-directory: ${{ github.workspace }}
        run: node scripts/check-version-sync.mjs

      # Previously release-workflow only, so a doc that restates a code constant
      # could drift for weeks and only surface at ship time. It costs one node
      # process here.
      - name: Doc constants match the code
        working-directory: ${{ github.workspace }}
        run: npm run check:docs

      # Relative markdown links across docs/ and root *.md. Cheap, deterministic,
      # and currently green, so a broken link fails CI instead of shipping.
      - name: Doc relative links resolve
        working-directory: ${{ github.workspace }}
        run: npm run check:doc-links

      # Packaging is otherwise invisible to CI, which is how the `sidecar/`
      # staging bug shipped ~50 releases: every other gate passes because the
      # backend runs fine from a checkout, and only an installer payload shows
      # that AppData got a tree with no dependencies. `npm run
      # prepare:desktop-backend` stages that payload (it is also a release
      # step); the `node --test` integrity suite that used to run here was
      # deleted with the rest of the tests on 2026-10-17.

      # The backend emits SSE frames; the frontend's Zod schema and dispatcher
      # are both hand-maintained and nothing compared them. `recovery` — the
      # frame every self-correction rescue emits — was accepted by the schema
      # and dropped by the dispatcher, so no rescue was ever visible. This is a
      # static check: no interpreter, no build, a second to run.
      - name: SSE frame parity (backend vs schema vs dispatcher)
        working-directory: ${{ github.workspace }}
        run: npm run check:sse

      # The updater signature is the only thing standing between a published
      # release and an installer the app would refuse. The release job signs
      # with a private key from a secret and the app verifies with a public
      # key pinned in tauri.conf.json; nothing compared the two, so a
      # mismatch was invisible until a user tried to update. This checks the
      # VERIFIER that now does that comparison, against a keypair it
      # generates — a verifier that accepted everything would be worse than
      # none. Pure static: one node process, no build.
      - name: Updater signature verifier self-test
        working-directory: ${{ github.workspace }}
        run: npm run check:minisign

  frontend-tsc-eslint:
    name: Frontend — tsc + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Every `truncate` has to be on an element that CAN truncate.
      # `overflow: hidden` and `text-overflow: ellipsis` do not apply to an
      # inline box, so a `truncate` on a bare `<span>` is inert: the text is
      # not clipped and not ellipsised, it just runs on and paints over
      # whatever sits beside it. That is what a long model id did in the
      # model list.
      #
      # The gate reads the source with the TypeScript compiler API rather
      # than a regex, because only the AST can tell a flex CONTAINER from a
      # flex ITEM (`flex-1` is item sizing, not a container) and can see a
      # className written as a template literal or a `cn(...)` call.
      - name: Truncated text is actually truncated
        run: npm run check:truncate

      - name: Build web (tsc + vite)
        run: npm run build:web

      # The committed frontend API types must match the committed schema
      # (audit P1#7). `gen:api` only reads docs/api/openapi.json, so it needs
      # no Python — unlike the schema gate, which lives in the backend job.
      # Regenerating and diffing is the check: a 600 KB generated file that
      # nothing verifies is just a stale artifact with a confident name, and
      # the backend job's check:api would still be green while it rotted.
      - name: Generated API types in sync
        run: |
          npm run gen:api
          # `git status --porcelain`, not `git diff --exit-code`: a DELETED
          # generated file is untracked after regeneration and would show no
          # diff at all, so the diff-only form of this check passes vacuously
          # on exactly the case it exists to catch.
          if [ -n "$(git status --porcelain -- frontend/desktop/src/api/gen/openapi.ts)" ]; then
            echo "::error::Generated API types are out of sync with docs/api/openapi.json"
            echo "Run 'npm run gen:api' and commit the result."
            git status --porcelain -- frontend/desktop/src/api/gen/openapi.ts
            exit 1
          fi

      - name: eslint
        run: npm run lint -w frontend/desktop

      # Design-drift ratchet (audit P0#2): px font sizes, raw hex, raw <button>
      # outside components/ui, bare fetch() outside src/api, inline style
      # objects. Baselined, so it fails only on NEW drift — eslint bans the px
      # case too, and this covers the four habits lint has no rule for.
      - name: Design drift guardrail
        run: npm run check:design

      # Warning-count ratchet (audit B3): fails when eslint's warning count
      # exceeds frontend lint-budget.json; a PR that lowers the count lowers
      # the budget with it.
      - name: Lint warning ratchet
        run: npm run lint:ratchet

  mobile-typecheck:
    name: Mobile — typecheck + parity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mobile test (tsc + parity audit)
        run: npm run test -w frontend/mobile
