name: CI

# One reusable gate suite. The release workflow calls this workflow, so a tag
# cannot publish a commit whose gates never ran — the build job declares
# `needs: ci`. Every job calls one `npm run gates:<group>`; the gate list
# itself lives in scripts/gates.mjs, not in this file.
#
# Job names are deliberately UNCHANGED from the old `Type check` workflow.
# GitHub branch protection refers to check names; renaming a job silently
# removes the requirement.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_call:
  workflow_dispatch:

# Least privilege: no job here writes to the repository, including the
# workflow_call from the release (whose own build job has contents: write).
permissions:
  contents: read

concurrency:
  # NOT `${{ github.workflow }}-${{ github.ref }}`: in a workflow_call,
  # `github.workflow` is the CALLER's name (Release desktop), which would put
  # this job in the caller's own concurrency group and make it wait on — or
  # cancel — the run that is waiting for it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # Pure Node: naming, the generated API index, SSE parity (including
      # handler supply), the minisign verifier self-test, version sync, the
      # docs claims, doc links, and the tool-registration census.
      - name: Gates (static)
        run: npm run gates:static

  backend:
    name: Backend — mypy + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-py/pyproject.toml
      - name: Install backend (with dev extras)
        working-directory: backend-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # Gates that import the app: the OpenAPI drift gate and the brain-config
      # key/range probe; then ruff + mypy; then the Linux startup smoke.
      - name: Gates (backend)
        run: npm run gates:backend

  backend-smoke-windows:
    name: Backend — startup smoke (Windows)
    # The product is a Windows desktop app, and the smoke is the only gate
    # that sees whether the app starts. Running it only on Linux meant the
    # one platform the product ships on was the one platform nothing
    # exercised at runtime.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-py/pyproject.toml
      - name: Install backend (with dev extras)
        working-directory: backend-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Gates (Windows smoke)
        run: npm run gates:smoke

  frontend-tsc-eslint:
    name: Frontend — tsc + eslint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # Truncate/AST, design drift, the lint warning ratchet, tsc + eslint, the
      # Vite build, and the generated-API-types diff.
      - name: Gates (frontend)
        run: npm run gates:frontend

  mobile-typecheck:
    name: Mobile — typecheck + parity audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Gates (mobile)
        run: npm run gates:mobile
