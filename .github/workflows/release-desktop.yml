name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 0.12.1)'
        required: true
        type: string

permissions:
  contents: write

# Two tags pushed in quick succession must not publish at the same time —
# and a release is NEVER cancelled: cancelling after the installer is signed
# but before it is published leaves a tag with no asset, which is worse than
# a queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI gates
    # The same reusable workflow every push runs. `build` needs it, so a tag
    # can never publish a commit whose gates did not run — including a tag
    # pushed onto a commit that never went through a branch push.
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: windows-latest
    # A cold Tauri build on a windows runner is 15–25 minutes; the node
    # sidecar download and the NSIS packaging are on top of that. The
    # default 6-hour ceiling means a hung build holds the runner and the
    # release tag for six hours before it is killed.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify clean release provenance
        shell: pwsh
        run: |
          git diff --quiet; if ($LASTEXITCODE -ne 0) { throw 'working tree has unstaged changes' }
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { throw 'working tree has staged changes' }
          $untracked = git ls-files --others --exclude-standard
          if ($untracked) { throw "working tree has untracked files:`n$untracked" }

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # Required by this pinned revision. The action used to be referenced
          # as @stable, which defaulted it; pinning the SHA without adding the
          # input made every release fail here with "'toolchain' is a required
          # input". Keep the pin, state the toolchain.
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: frontend/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $candidate = $env:RELEASE_VERSION_INPUT
          } else {
            $candidate = $env:GITHUB_REF_NAME
          }
          $version = $candidate -replace '^v', ''
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $candidate"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Releasing version $version"

      - name: Sync backend environment for the payload
        working-directory: backend-py
        run: uv sync --frozen --python 3.12

      - name: Verify release version against package sources
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_VERSION -ne $packageVersion) {
            throw "Release version $env:RELEASE_VERSION does not match package.json version $packageVersion"
          }
          Write-Host "Verified release version $packageVersion"

      - name: Download Node sidecars
        run: npm run download:node-binaries

      - name: Prepare portable Python and backend resources
        run: node scripts/prepare-desktop-backend.mjs --release

      - name: Backend lockfile
        working-directory: backend-py
        shell: pwsh
        # ruff and mypy run in the CI job this build depends on. `uv lock
        # --check` stays here because it is release-specific: the payload and
        # backend-runtime.stamp are staged from this lockfile, so a lock that
        # drifted must abort the build before it stages anything.
        run: |
          uv lock --check --python 3.12; if ($LASTEXITCODE -ne 0) { throw 'uv lock --check failed' }

      # The gates are not repeated here: this job depends on `ci`, which runs
      # the same reusable workflow every branch push runs. What remains below
      # is the build itself (and the release-specific lockfile check above).
      # There is no test suite anywhere in this repo on purpose — the backend
      # and frontend suites were deleted on 2026-10-17 at the owner's request.

      - name: Build web UI
        # `generate_context!` in src-tauri reads the frontendDist path at compile
        # time and panics if it is missing. web-dist/ is gitignored, so on a
        # fresh checkout it exists only once something builds it — and the
        # release script builds it later than the Rust check below.
        run: npm run build:web

      - name: Rust format and check
        run: |
          cargo fmt --manifest-path frontend/desktop/src-tauri/Cargo.toml --check
          cargo check --manifest-path frontend/desktop/src-tauri/Cargo.toml --locked

      - name: Build and publish release assets
        if: github.event_name == 'push'
        run: node scripts/release-desktop.mjs --tauri --publish

      - name: Build draft release assets
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-desktop.mjs --tauri --publish --draft

  publish:
    name: Publish release (flip draft → live)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build
    # One `gh release edit`. A minute is generous; the default 6-hour
    # ceiling means a hung `gh` call holds a published-looking release open.
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish draft release
        run: gh release edit v${{ needs.build.outputs.version }} --draft=false --latest --repo ${{ github.repository }}
